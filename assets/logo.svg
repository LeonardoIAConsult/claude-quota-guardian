<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M128 16 L216 48 V120 C216 178 178 218 128 240 C78 218 40 178 40 120 V48 Z"
        fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="8" stroke-linejoin="round"/>

  <!-- Terminal prompt chevron -->
  <path d="M82 96 L118 128 L82 160" fill="none" stroke="url(#accentGrad)"
        stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor / checkpoint bar -->
  <rect x="134" y="146" width="44" height="16" rx="8" fill="url(#accentGrad)"/>

  <!-- Quota arc: session filling up, guarded -->
  <path d="M76 60 A88 88 0 0 1 180 60" fill="none" stroke="#38bdf8"
        stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <circle cx="180" cy="60" r="9" fill="#38bdf8"/>
</svg>
