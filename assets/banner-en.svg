<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280 M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <!-- Shield logo (left) -->
  <g transform="translate(120,160) scale(1.25)">
    <path d="M128 16 L216 48 V120 C216 178 178 218 128 240 C78 218 40 178 40 120 V48 Z"
          fill="#0f172a" stroke="#f59e0b" stroke-width="8" stroke-linejoin="round"/>
    <path d="M82 96 L118 128 L82 160" fill="none" stroke="url(#accent)"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="134" y="146" width="44" height="16" rx="8" fill="url(#accent)"/>
    <path d="M76 60 A88 88 0 0 1 180 60" fill="none" stroke="#38bdf8"
          stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <circle cx="180" cy="60" r="9" fill="#38bdf8"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="520" y="270" font-size="64" font-weight="700" fill="#f8fafc">Claude Quota Guardian</text>
    <text x="520" y="340" font-size="30" fill="#fbbf24">Your safety net for long AI sessions</text>
    <text x="522" y="386" font-size="24" fill="#94a3b8">Automatic checkpoint before the cutoff · resume with zero re-explaining</text>

    <!-- mini flow -->
    <g font-size="22" fill="#cbd5e1">
      <rect x="520" y="440" width="150" height="52" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="546" y="473">detect</text>
      <text x="686" y="473" fill="#f59e0b">→</text>
      <rect x="716" y="440" width="150" height="52" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="737" y="473">save</text>
      <text x="882" y="473" fill="#f59e0b">→</text>
      <rect x="912" y="440" width="150" height="52" rx="10" fill="#1e293b" stroke="#f59e0b"/>
      <text x="936" y="473" fill="#fbbf24">resume</text>
    </g>
  </g>
</svg>
